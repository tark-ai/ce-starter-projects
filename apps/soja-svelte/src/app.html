<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="16x16 32x32 48x48" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="preconnect" href="https://cdn.commercengine.io" crossorigin />
		<link rel="preconnect" href="https://images.tarkai.com" crossorigin />
		%sveltekit.head%
		<!-- The reveal entrance starts at opacity 0, so content would stay invisible without hydration. -->
		<noscript>
			<style>/* biome-ignore-start lint/complexity/noImportantStyles: must beat the utility classes on the element */
[data-reveal]{opacity:1!important;transform:none!important}
/* biome-ignore-end lint/complexity/noImportantStyles: must beat the utility classes on the element */</style>
		</noscript>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
