<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Commerce Engine" />

  <link rel="preconnect" href="https://cdn.commercengine.io" crossorigin>
  <link rel="preconnect" href="https://staging.api.commercengine.io" crossorigin>

  <title>Soja — Rituals of natural skincare</title>
  <meta name="description"
    content="Soja is a quiet-luxury Scandinavian skincare storefront built with Commerce Engine. Hand-crafted bioformulations balanced with ethically-sourced ingredients from our laboratory in Copenhagen." />
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- The reveal entrance starts at opacity 0, so content would stay invisible
       without hydration. -->
  <noscript>
    <style>[data-reveal]{opacity:1!important;transform:none!important}</style>
  </noscript>

  <!-- Static and absolute: OG scrapers do not execute JavaScript. -->
  <meta data-seo-default property="og:type" content="website" />
  <meta data-seo-default property="og:site_name" content="Soja" />
  <meta data-seo-default property="og:title" content="Soja — Rituals of natural skincare" />
  <meta data-seo-default property="og:description"
    content="Hand-crafted bioformulations balanced with ethically-sourced ingredients from our laboratory in Copenhagen." />
  <meta data-seo-default property="og:url" content="https://soja.demo.commercengine.com/" />
  <meta data-seo-default property="og:image" content="https://soja.demo.commercengine.com/og-image.jpg" />
  <meta data-seo-default property="og:image:type" content="image/jpeg" />
  <meta data-seo-default property="og:image:width" content="1200" />
  <meta data-seo-default property="og:image:height" content="630" />
  <meta data-seo-default property="og:image:alt" content="Soja — rituals of natural skincare" />
  <meta data-seo-default property="og:image" content="https://soja.demo.commercengine.com/og-image.avif" />
  <meta data-seo-default property="og:image:type" content="image/avif" />
  <meta data-seo-default property="og:image:width" content="1024" />
  <meta data-seo-default property="og:image:height" content="1536" />

  <meta data-seo-default name="twitter:card" content="summary_large_image" />
  <meta data-seo-default name="twitter:site" content="@commerceengine" />
  <meta data-seo-default name="twitter:title" content="Soja — Rituals of natural skincare" />
  <meta data-seo-default name="twitter:description"
    content="Hand-crafted bioformulations balanced with ethically-sourced ingredients from our laboratory in Copenhagen." />
  <meta data-seo-default name="twitter:image" content="https://soja.demo.commercengine.com/og-image.jpg" />
  <meta data-seo-default name="twitter:image:alt" content="Soja — rituals of natural skincare" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
